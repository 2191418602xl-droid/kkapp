<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KIRAKIRA · 高保真原型</title><link rel="stylesheet" href="styles.css"></head><body class="index"><header><span class="eyebrow">Interactive world prototype</span><h1>KIRAKIRA</h1><p>以 KKApp 现有世界、角色、消息、社区与创作功能为基础的完整高保真原型。参考深空感官网的构图、光色和材质语言，保留项目自己的品牌、内容与交互。</p></header><main class="grid" id="grid"></main><script>const pages=[['01 · 沉浸世界','world.html'],['02 · 发现广场','discover.html'],['03 · 世界详情','detail.html'],['04 · 虚拟手机','phone.html'],['05 · 消息','messages.html'],['06 · 角色聊天','chat.html'],['07 · 世界社区','forum.html'],['08 · 创作者中心','creator.html'],['09 · 智能体详情','agent.html'],['10 · 我的阁楼','profile.html'],['11 · 星钻与会员','wallet.html'],['12 · 通知中心','notifications.html'],['13 · 设置','settings.html']];document.querySelector('#grid').innerHTML=pages.map(([n,p])=>`<section class="item"><h2>${n}</h2><div class="device"><iframe src="${p}" title="${n}" loading="lazy"></iframe></div></section>`).join('')</script></body></html>
