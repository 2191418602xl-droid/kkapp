<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=402"><title>设置</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"></head><body class="phone-page" style="padding-bottom:30px"><div data-status></div><main class="page"><div class="title-row"><a class="icon-btn" href="profile.html"><i class="fa-solid fa-chevron-left"></i></a><h2>设置</h2><span style="width:42px"></span></div><span class="eyebrow">Playback</span><div class="setting-group glass" style="margin-top:9px"><div class="setting-row"><i class="fa-solid fa-gem"></i><span>在线播放音质</span><small>无损 <i class="fa-solid fa-chevron-right"></i></small></div><div class="setting-row"><i class="fa-solid fa-volume-high"></i><span>音量标准化</span><div class="toggle"></div></div><div class="setting-row"><i class="fa-solid fa-water"></i><span>歌曲淡入淡出</span><small>5 秒 <i class="fa-solid fa-chevron-right"></i></small></div></div><span class="eyebrow">Appearance</span><div class="setting-group glass" style="margin-top:9px"><div class="setting-row"><i class="fa-solid fa-moon"></i><span>深色外观</span><div class="toggle"></div></div><div class="setting-row"><i class="fa-solid fa-wand-magic-sparkles"></i><span>动态背景</span><div class="toggle"></div></div><div class="setting-row"><i class="fa-solid fa-universal-access"></i><span>减少动态效果</span><small>关闭</small></div></div><span class="eyebrow">Account & data</span><div class="setting-group glass" style="margin-top:9px"><div class="setting-row"><i class="fa-solid fa-laptop"></i><span>设备管理</span><small>3 台</small></div><div class="setting-row"><i class="fa-solid fa-bell"></i><span>通知</span><i class="fa-solid fa-chevron-right" style="color:var(--muted)"></i></div><div class="setting-row"><i class="fa-solid fa-shield-halved"></i><span>隐私与数据</span><i class="fa-solid fa-chevron-right" style="color:var(--muted)"></i></div><div class="setting-row"><i class="fa-
