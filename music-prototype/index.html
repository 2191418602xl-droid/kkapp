<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ORBIT Music · Prototype</title><link rel="stylesheet" href="styles.css"></head><body class="index-body"><header class="index-header"><span class="eyebrow">High fidelity music experience</span><h1>ORBIT Music</h1><p>以电影级人物与场景构图、冷感透明材质和深空光色构建的音乐 App 高保真原型。所有界面均为独立 HTML，可直接进入开发或单独演示。</p></header><main class="prototype-grid" id="grid"></main><script>const pages=[['01 · 启动','splash.html'],['02 · 新手引导','onboarding.html'],['03 · 首页','home.html'],['04 · 发现','discover.html'],['05 · 搜索','search.html'],['06 · 歌单详情','playlist.html'],['07 · 专辑详情','album.html'],['08 · 沉浸播放','player.html'],['09 · 动态歌词','lyrics.html'],['10 · 音乐库','library.html'],['11 · 我的','profile.html'],['12 · 设置','settings.html']];document.querySelector('#grid').innerHTML=pages.map(([n,p])=>`<section class="prototype-item"><h2>${n}</h2><div class="device"><iframe src="${p}" title="${n}" loading="lazy"></iframe></div></section>`).join('')</script></body></html>
